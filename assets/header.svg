<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Renny Thomas, Gen AI Engineer">
  <rect width="1000" height="300" fill="#f6f5f0"/>
  <g stroke="#dcdad0" stroke-width="1">
    <path d="M0 50H1000M0 100H1000M0 150H1000M0 200H1000M0 250H1000"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300"/>
  </g>
  <rect x="46" y="46" width="920" height="220" rx="14" fill="#2563eb"/>
  <rect x="40" y="40" width="920" height="220" rx="14" fill="#f6f5f0" stroke="#0b0b0c" stroke-width="2.5"/>
  <circle cx="78" cy="82" r="5" fill="#2563eb">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="94" y="87" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="2">GEN AI ENGINEER · KERALA, INDIA</text>
  <text x="76" y="160" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" fill="#0b0b0c" letter-spacing="-2">Renny Thomas</text>
  <rect x="76" y="176" width="0" height="5" fill="#2563eb">
    <animate attributeName="width" from="0" to="210" dur="1s" begin="0.4s" fill="freeze"/>
  </rect>
  <g font-family="Consolas,Menlo,monospace" font-size="19" fill="#0b0b0c">
    <text x="76" y="228" opacity="0">I build AI systems people can trust.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
    <text x="76" y="228" opacity="0">Agentic workflows with Claude + LangGraph.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></text>
    <text x="76" y="228" opacity="0">MCP tool servers in Node.js + TypeScript.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></text>
    <text x="76" y="228" opacity="0">RAG apps, ML models and cloud deployments.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/></text>
  </g>
  <g transform="translate(700 70)">
    <path d="M40 60 L130 20 M40 60 L130 100 M130 20 L220 60 M130 100 L220 60 M130 20 L130 100" stroke="#0b0b0c" stroke-width="2" fill="none"/>
    <g fill="#f6f5f0" stroke="#0b0b0c" stroke-width="2.5">
      <circle cx="40" cy="60" r="14"/><circle cx="130" cy="20" r="14"/><circle cx="130" cy="100" r="14"/><circle cx="220" cy="60" r="14" fill="#2563eb"/>
    </g>
    <circle r="5" fill="#2563eb"><animateMotion dur="3s" repeatCount="indefinite" path="M40 60 L130 20 L220 60 L130 100 L40 60"/></circle>
    <circle r="5" fill="#0b0b0c"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M40 60 L130 100 L220 60 L130 20 L40 60"/></circle>
    <circle cx="220" cy="60" r="14" fill="none" stroke="#2563eb" stroke-width="2">
      <animate attributeName="r" values="14;28" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
